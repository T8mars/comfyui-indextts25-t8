name: Test ComfyUI Node

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out node
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Check out current ComfyUI
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          path: .comfyui
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfyui/requirements.txt -r requirements.txt pytest comfy-cli
      - name: Run tests against ComfyUI V3 API
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
        run: python -m pytest -p no:cacheprovider
      - name: Verify generated workflows are current
        run: |
          python scripts/build_example_workflows.py
          git diff --exit-code
      - name: Compile integration sources
        run: python -m compileall -q runtime services scripts nodes_v3.py __init__.py
      - name: Validate Comfy Registry package
        run: comfy node validate
