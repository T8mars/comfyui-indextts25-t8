name: Test ComfyUI Node

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux current / Python 3.11
            os: ubuntu-latest
            python: "3.11"
            torch-packages: torch torchvision torchaudio
          - name: Windows portable / Python 3.10 / torch 2.8
            os: windows-latest
            python: "3.10"
            torch-packages: torch==2.8.0 torchvision==0.23.0 torchaudio==2.8.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out node
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Check out current ComfyUI
        uses: actions/checkout@v7
        with:
          repository: Comfy-Org/ComfyUI
          path: .comfyui
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.torch-packages }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfyui/requirements.txt -r requirements.txt pytest comfy-cli pylint==4.0.8
      - name: Run tests against ComfyUI V3 API
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/.comfyui
        run: python -m pytest -p no:cacheprovider
      - name: Check Registry Pylint/Astroid compatibility
        run: python -m pylint services/model_store.py --disable=all --enable=fatal --score=no
      - name: Verify generated workflows are current
        if: runner.os == 'Linux'
        run: |
          python scripts/build_example_workflows.py
          git diff --exit-code
      - name: Compile integration sources
        run: python -m compileall -q runtime services scripts nodes_v3.py __init__.py
      - name: Validate Comfy Registry package
        run: comfy node validate
