name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test before publish
    uses: ./.github/workflows/test_action.yml
  publish-node:
    name: Publish Custom Node to Registry
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check whether Registry version already exists
        id: registry-version
        run: python scripts/check_registry_version.py
      - name: Version already exists; skip duplicate upload
        if: steps.registry-version.outputs.exists == 'true'
        run: echo "Registry version already exists; duplicate upload skipped successfully."
      - name: Publish Custom Node
        if: steps.registry-version.outputs.exists != 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
